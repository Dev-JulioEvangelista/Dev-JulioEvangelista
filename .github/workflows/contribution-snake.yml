name: Atualiza a cobrinha de contribuições

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar animação das contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dev-JulioEvangelista
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FE6A2F&color_dots=%23F0EFEC,%23F5C4AB,%23FF9B72,%23FE6A2F,%23C64B20
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FE6A2F&color_dots=%231E1E1E,%23392B27,%23734B37,%23B75A36,%23FE6A2F
      - name: Publicar animação no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
